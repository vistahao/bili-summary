[storage]
data_root = /home/dev/bili-summary-data

[processing]
audit_level = basic
# lecture 适合知识讲座；practice 适合刷题课，会保留题目与推理并过滤歌曲、投票流程和无关闲聊。
content_mode = lecture
transcriber_mode = auto
cost_submission_limit_cny = 1.0

[bilibili]
# AI subtitles may require a logged-in Cookie. Put it in a one-line file under
# the Git-ignored .secrets directory, then uncomment this path. Never commit it.
# cookie_file = /home/dev/projects/bili-summary/.secrets/bilibili_cookie.txt

[codex]
# Backward-compatible default used when text_profile.codex_default is absent.
model = gpt-5.6-sol

[text_routes]
# Long-term defaults selected after the first model comparison.
organize = deepseek_flash_high
summary = codex_default
basic_audit = deepseek_pro_high
deep_audit = deepseek_pro_high

[text_profile.codex_default]
driver = codex_exec
model = gpt-5.6-sol
reasoning = high
max_output_tokens = 32768

[text_profile.deepseek_flash_low]
driver = deepseek_http
model = deepseek-v4-flash
reasoning = low
max_output_tokens = 32768

[text_profile.deepseek_flash_high]
driver = deepseek_http
model = deepseek-v4-flash
reasoning = high
max_output_tokens = 32768

[text_profile.deepseek_pro_high]
driver = deepseek_http
model = deepseek-v4-pro
reasoning = high
max_output_tokens = 32768

[text_preset.quality]
organize = deepseek_flash_high
summary = codex_default
basic_audit = deepseek_pro_high
deep_audit = deepseek_pro_high

[text_preset.speed]
organize = deepseek_flash_low
summary = deepseek_flash_low
basic_audit = deepseek_flash_low
deep_audit = deepseek_flash_low

[deepseek]
base_url = https://api.deepseek.com
api_key_env = DEEPSEEK_API_KEY
# Prefer an environment variable or a one-line, chmod 600, Git-ignored file.
# api_key_file = /home/dev/projects/bili-summary/.secrets/deepseek_api_key.txt

[aliyun_asr]
# Both comparison models use the Beijing asynchronous file-transcription API.
# The legacy endpoint works without a workspace ID; set this to use the newer
# workspace-specific endpoint after copying the non-secret ID from the console.
# workspace_id = llm-xxxxxxxxxxxxxxxx
api_key_env = DASHSCOPE_API_KEY
# Prefer an environment variable or a one-line, chmod 600, Git-ignored file.
# api_key_file = /home/dev/projects/bili-summary/.secrets/dashscope_api_key.txt

[local_asr]
# Optional CPU fallback. Keep the binary/model in a rebuildable tool cache,
# not in the project or long-term result directory.
# binary = /home/dev/.cache/bili-summary/whisper.cpp-b4938/whisper-cli
# model = /home/dev/.cache/bili-summary/whisper.cpp-b4938/ggml-small.bin
threads = 8

[long_processing]
# Smaller chunks improve recovery granularity; larger chunks reduce repeated model overhead.
chunk_target_minutes = 15
chunk_max_minutes = 20
deep_chunk_target_minutes = 50
deep_chunk_max_minutes = 55

# Secrets are intentionally absent. Future API keys must be supplied through a
# Git-ignored local secret store or environment variables.
